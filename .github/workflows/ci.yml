name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.package.outputs.sha256 }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build and identify the release wheel
        id: package
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/trace-wheel" .
          python scripts/release_wheel.py record "$RUNNER_TEMP/trace-wheel"
      - name: Upload the candidate and its checksums
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trace-wheel-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trace-wheel/
          if-no-files-found: error

  test:
    needs: wheel
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Require a successful wheel build
        if: ${{ needs.wheel.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install -c constraints.txt -e ".[dev,corpus]" ruff
      - name: Configure git for fixture seeding
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: python -m ruff check memory trace_memory
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q -p no:cacheprovider -rfE --tb=short 2>&1 | tee pytest.log
      - name: Publish failed test names as annotations
        if: failure()
        shell: bash
        run: grep -E '^(FAILED|ERROR) ' pytest.log | head -40 | sed 's/^/::error::/' || true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.wheel.outputs.artifact-id }}
          path: ${{ runner.temp }}/trace-wheel
          merge-multiple: true
      - name: Install pinned native test clients
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/trace-clients" --no-audit --no-fund \
            @opencode/cli@2.2.5 @openai/codex@0.163.0 @anthropic-ai/claude-code@2.1.295
      - name: Verify the installed wheel with native clients
        shell: bash
        env:
          TRACE_WHEEL_SHA256: ${{ needs.wheel.outputs.sha256 }}
          TRACE_WHEEL_VERSION: ${{ needs.wheel.outputs.version }}
        run: |
          python scripts/release_wheel.py verify "$RUNNER_TEMP/trace-wheel"
          python - <<'PY'
          import json
          import os
          import sqlite3
          import subprocess
          import sys
          import tempfile
          from contextlib import closing
          from pathlib import Path

          source = Path.cwd()
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          wheel, = (runner_temp / "trace-wheel").glob("trace-*.whl")
          with tempfile.TemporaryDirectory(prefix="trace-wheel-") as path:
              root = Path(path)
              subprocess.run([sys.executable, "-m", "venv", str(root / "venv")], check=True)
              bin_dir = root / "venv" / ("Scripts" if os.name == "nt" else "bin")
              python = bin_dir / ("python.exe" if os.name == "nt" else "python")
              trace = bin_dir / ("trace.exe" if os.name == "nt" else "trace")
              subprocess.run([str(python), "-m", "pip", "install", "-c", str(source / "constraints.txt"), str(wheel)],
                             cwd=root, check=True)
              subprocess.run([str(python), "-m", "pip", "check"], cwd=root, check=True)
              subprocess.run([sys.executable, "-m", "research.phase6.auth_debug_smoke",
                              "--python", str(python), "--scratch", str(root / "auth-debug-smoke")],
                             cwd=source, check=True)
              project = root / "project"
              project.mkdir()
              expected_version = os.environ["TRACE_WHEEL_VERSION"]
              cli_version = subprocess.check_output([str(trace), "--version"], cwd=project, text=True).strip()
              installed_version = subprocess.check_output(
                  [str(python), "-c", "from importlib.metadata import version; print(version('trace'))"],
                  cwd=project, text=True,
              ).strip()
              print(f"{cli_version}; installed distribution {installed_version}")
              if cli_version != f"trace {expected_version}" or installed_version != expected_version:
                  raise RuntimeError(f"installed wheel and CLI must both report {expected_version}")
              subprocess.run([str(trace), "install", "--agent", "codex", "--agent", "claude",
                              "--agent", "antigravity"], cwd=project, check=True)
              subprocess.run([str(trace), "doctor"], cwd=project, check=True)
              subprocess.run([str(trace), "uninstall", "--all"], cwd=project, check=True)
              subprocess.run([str(trace), "init"], cwd=project, check=True)
              backup = root / "backup.db"
              subprocess.run([str(trace), "backup", str(backup)], cwd=project, check=True)
              with closing(sqlite3.connect(backup)) as db:
                  assert db.execute("PRAGMA quick_check").fetchone() == ("ok",)
              packages = runner_temp / "trace-clients/node_modules"
              package = packages / "@opencode/cli"
              manifest = json.loads((package / "package.json").read_text(encoding="utf-8"))
              assert manifest["version"] == "2.2.5"
              result = subprocess.run(
                  [sys.executable, "-m", "research.phase6.native_smoke", "--major", "2", "--managed", "--universal",
                   "--binary", str(package / manifest["bin"]["opencode"]),
                   "--python", str(python), "--scratch", str(root / "native")],
                  cwd=source, capture_output=True, text=True,
              )
              if result.returncode:
                  raise RuntimeError(result.stderr + result.stdout)
              print(result.stdout, end="")
              observed = json.loads(result.stdout)
              assert observed["native_evidence_round_trip"] and observed["backup_restore_verified"]
              codex_name = "codex.exe" if os.name == "nt" else "codex"
              codex, = (path for scope in (packages / "@openai", packages / "@openai/codex/node_modules/@openai")
                        for path in scope.glob(f"codex-*/vendor/*/bin/{codex_name}"))
              claude_package = packages / "@anthropic-ai/claude-code"
              claude_manifest = json.loads((claude_package / "package.json").read_text(encoding="utf-8"))
              claude = claude_package / claude_manifest["bin"]["claude"]
              subprocess.run(
                  [sys.executable, "-m", "research.phase6.universal_smoke", "--codex", str(codex),
                   "--claude", str(claude), "--python", str(python), "--scratch", str(root / "universal")],
                  cwd=source, check=True,
              )
          PY

  python-compatibility:
    needs: wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.wheel.outputs.artifact-id }}
          path: ${{ runner.temp }}/trace-wheel
          merge-multiple: true
      - name: Check wheel installation and offline demo
        shell: bash
        env:
          TRACE_WHEEL_SHA256: ${{ needs.wheel.outputs.sha256 }}
        run: |
          python scripts/release_wheel.py verify "$RUNNER_TEMP/trace-wheel"
          python -m pip install -c constraints.txt "$RUNNER_TEMP"/trace-wheel/trace-*.whl
          python -m pip check
          python -m research.phase6.auth_debug_smoke --python "$(command -v python)" --scratch "$RUNNER_TEMP/trace-auth-debug"
