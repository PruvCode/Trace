[project]
name = "trace"
version = "0.1.0"
description = "Reproducible benchmark/evaluation harness for coding-agent memory (benchmark-first)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    # Phase 2 structural memory: official MCP SDK (v2 API: MCPServer),
    # tree-sitter core + Python grammar only. No embeddings, no graph DB.
    "mcp>=2.2",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark*", "agent*", "memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
